# Nemotron-3-Nano-Omni PTQ launch settings — TEMPLATE ONLY (not used at runtime).
# Copy to launch_local.yaml in this directory, then edit.

# Slurm --gpus for launch_interactive_session.sh. quantize.sh does not read this file.
GPUS_PER_NODE: 8
SLURM_TIME_LIMIT: '4:00:00'

CONTAINER_IMAGE: /lustre/path/to/nemo_26_06_00.sqsh  # REPLACE_ME — enroot import of nvcr.io/nvidia/nemo:26.06.00.
CONTAINER_MOUNT_HOST: /lustre  # REPLACE_ME if the host filesystem root is mounted elsewhere.

PARTITIONS:
  - backfill_block1
  - polar3
  - polar4
  - polar
  - grizzly
FEW_NODES_PARTITIONS:
  - interactive
SINGLE_NODE_PARTITION: interactive_singlenode

SLURM_ACCOUNT_RACE: 0
SLURM_ACCOUNTS:
  - your-slurm-account  # REPLACE_ME with the account used for normal submissions.
SLURM_ACCOUNTS_RACE:
  - your-first-slurm-account  # REPLACE_ME with the first account to race.
