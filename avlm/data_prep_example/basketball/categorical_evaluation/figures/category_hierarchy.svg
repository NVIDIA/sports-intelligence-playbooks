<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="Basketball understanding hierarchy with four non-overlapping super categories">
  <rect width="1000" height="440" fill="#f7f8fa"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L10 5 L0 10 z" fill="#9aa6b5"/>
    </marker>
  </defs>
  <rect x="20" y="192" width="155" height="60" rx="10" fill="#173f5f"/>
  <text x="97" y="217" text-anchor="middle" fill="white" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="14">Basketball</text>
  <text x="97" y="237" text-anchor="middle" fill="white" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="14">Understanding</text>
  <g stroke="#9aa6b5" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M175 222 C220 222, 214 60, 260 60"/>
    <path d="M175 222 C220 222, 214 170, 260 170"/>
    <path d="M175 222 C220 222, 214 270, 260 270"/>
    <path d="M175 222 C220 222, 214 385, 260 385"/>
  </g>
