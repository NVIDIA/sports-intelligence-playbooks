# Generic LoRA launch settings — TEMPLATE ONLY (not used at runtime).
# Copy to launch_local.yaml in this directory and edit.

CONFIG_YAML_REL: avlm/training/automodel/lora/configs/nemotron_omni_automodel_lora_singlenode.yaml
MODEL_NAME: nemotron_omni_lora

# GPU count: auto-detected from nvidia-smi / CUDA_VISIBLE_DEVICES at train time.
# Optional override: NUM_GPUS=4 in this file, or NUM_GPUS=4 bash train_lora.sh

# Writable cache root (HF hub, Triton, etc.). nemo_automodel ships in the container at /opt/Automodel.
# container can write to — local disk, tmpfs, or a shared filesystem. Not required to be on Lustre.
CACHE_DIR: /path/to/your/cache # REPLACE_ME with a writable cache directory.
