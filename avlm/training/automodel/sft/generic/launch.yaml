# Generic SFT launch settings — TEMPLATE ONLY (not used at runtime).
# Copy to launch_local.yaml in this directory and edit.

CONFIG_YAML_REL: avlm/training/automodel/sft/configs/nemotron_omni_automodel_sft_singlenode.yaml
