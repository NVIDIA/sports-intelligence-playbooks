#
# ModelOpt NVFP4 — pick ONE GPU block below (comment the other). MODEL_PATH overrides model_path.
# If load fails on modelopt_fp4, try vllm_quantization: modelopt_mixed locally.
#
#   SERVE_CONFIG=avlm/deployment/vLLM/configs/vllm_server_params_nvfp4.yaml \
#     bash avlm/deployment/vLLM/vllm_server.sh start
# Client: VLLM_CHAT_MODEL=nemotron_3_nano_omni_nvfp4

# model_path: nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4
# Default export of quantize.sh with configs/quantization_hf_tennis.yaml (<QUANT_RUN_LABEL>-<QUANT_FORMAT>-hf).
model_path: ${REPO_ROOT}/quantization_workspace/models/nemotron-3-nano-omni-sft-hubcalib-nvfp4-hf

cache_dir: ${REPO_ROOT}/.cache

served_model_name: nemotron_3_nano_omni_nvfp4

vllm_port: 12500
tensor_parallel_size: 1
data_parallel_size: 1
pin_serve_gpus: true
cuda_visible_devices: "0"

max_model_len: 32768
max_num_seqs: 4
max_num_queued_reqs: 8
vllm_kv_cache_memory: 8589934592

num_frames: 128
fps: 2
video_backend: hub_checkpoint
video_pruning_rate: 0.0

vllm_quantization: modelopt_fp4
vllm_kv_cache_dtype: fp8
vllm_enforce_eager: false

# --- A100 (Ampere SM80): Marlin linear + Marlin MoE (Cutlass MoE fails on A100) ---
vllm_dtype: bfloat16
vllm_linear_backend: marlin
vllm_moe_backend: marlin

# --- Blackwell (SM100): auto linear; NvFP4 MoE must use cutlass (not triton) ---
# vllm_dtype: auto
# vllm_linear_backend: auto
# vllm_moe_backend: cutlass

enable_reasoning: false
reasoning_parser: nemotron_v3

max_tokens: 512
stream: false
