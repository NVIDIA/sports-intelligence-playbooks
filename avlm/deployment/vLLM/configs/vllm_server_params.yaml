# Default tennis serve (8× DP). Swap the two model_path lines for Hub vs consolidated SFT weights.
# Override anytime: SERVE_CONFIG=.../vllm_server_params_fp8.yaml or MODEL_PATH=...
#
# HF greedy parity (tennis caption): keep vllm_enforce_eager false; do not set vllm_attention_backend.
# Reasoning quant VRAM compare: a100_{fp8,nvfp4}.yaml or blackwell_{bf16,fp8,nvfp4}.yaml.

model_path: nvidia/NVIDIA-NemotronLabs-AI-for-Media-Sports-Tennis
# model_path: ${REPO_ROOT}/model_checkpoints/automodel/sft/checkpoints_n8_tp1_pp1_ep8/epoch_1_step_2599/model/consolidated

cache_dir: ${REPO_ROOT}/.cache

served_model_name: nemotron_3_nano_omni

vllm_port: 12500
tensor_parallel_size: 1
data_parallel_size: 8
pin_serve_gpus: true
cuda_visible_devices: "0,1,2,3,4,5,6,7"
# One copy on GPU 0:
# tensor_parallel_size: 1
# data_parallel_size: 1
# cuda_visible_devices: "0"

# Long context for tennis 8×DP; num_frames: 128 requires sufficient max_model_len.
max_model_len: 131072
max_num_seqs: 4
max_num_queued_reqs: 64

num_frames: 128
fps: 2
video_backend: hub_checkpoint
video_pruning_rate: 0.0
vllm_dtype: bfloat16
vllm_enforce_eager: false

enable_reasoning: false
reasoning_parser: nemotron_v3

max_tokens: 512
stream: false
