[repo_docs]
command = "docs"
entry_point = "doc_build_toolchain.repo.docs:setup_repo_tool"

# build config (e.g. "debug" or "release") where to find build artifacts such as .pyd files.
# can be overridden via the --config command line flag.
config = "debug"

# Path to the logo image file to use in the LaTeX documentation.
# The path should be relative to *docs_root*.
# For LaTeX, the logo appears on the title page.
# Recommended formats: PDF or PNG for LaTeX.
logo = ""

# Path to the favicon image file to use for the documentation website.
# The path should be relative to *docs_root*.
# The default is the NVIDIA favicon.
# Recommended format: ICO, PNG, or SVG.
# Recommended sizes: 16x16, 32x32, or 48x48 pixels.
favicon = ""

# Doxygen version
#
# This can only be set in the ``[repo_docs]`` section of the :file:`repo.toml`.
doxygen_version = "1.9.6-${platform}+c23238db"

# A templated string that is used to structure the output directory.
# The :ref:`docs-substitutions` may be used.
#
# This must be a path relative to the output directory, or an exception will be raised.
output_path_template = "${project}/${version}${dash_build}"

# Specify whether a build of a project will be built when calling ``./repo docs`` without the ``--build`` argument.
build_by_default = true

# .. versionadded:: 0.33.0
#
# A list of mappings to create temporary symlinks during build time.
#
# A temporary links example :
#
# .. literalinclude:: /../repo.toml
#    :language: toml
#    :start-after: example-begin temporary-links
#    :end-before: example-end temporary-links
#
# Each mapping must have the following keys:
#
# ``source``
#   A path, either absolute or relative to ``docs_root``, that will be the source of the symlink.
#
# ``link_path``
#   A path, either absolute or relative to ``docs_root``, that will be the location of the temporary symlink.
#   The parent directory of this path must already exist.
temporary_links = []

# .. versionadded:: 0.41.0
#
# .. warning::
#
#    This feature is experimental.
#
# A list of mappings to remap source document locations at build time.
# Remapped source documents map source files to arbitrary locations within the ``docs_root`` directory without the need to create a symlink.
#
# A remapped source documents example :
#
# .. literalinclude:: /../repo.toml
#    :language: toml
#    :start-after: example-begin remapped_source_docs
#    :end-before: example-end remapped_source_docs
#
# This will take all source documents found in ``examples/remapped`` and map them into a directory called ``rm``
# in the ``docs_root`` directory. To map the files directly into the ``docs_root`` directory, use ``destination = ""``.
#
# Each mapping must have the following keys:
#
# ``source``
#   A path, either absolute or relative to ``docs_root``, that will serve as the source for the documents to be remapped.
#
# ``destination``
#   The destination (relative to ``docs_root``) to which the files found in the ``source`` directory will be remapped.
remapped_source_docs = []

# .. versionadded:: 0.32.0
#
# Boolean to control if Sphinx runs.
sphinx_enabled = true

# .. versionchanged:: 0.20.0
#
#    Now accepts a list of paths to strip.
#
# This is a string (or list of strings) which is passed to Doxygen's
# `STRIP_FROM_PATH <https://www.doxygen.nl/manual/config.html#cfg_strip_from_path>`__ configuration value.
# The given values are stripped from the start of the output of any paths that Doxygen processes.
#
# Can use :ref:`docs-substitutions`.
doxygen_strip_from_path = [".."]

# A list of filepath patterns that are expanded and used as the input for Doxygen.
doxygen_input = []

# A list of regex patterns that are used to filter the output from Doxygen on the command line.
doxygen_output_exclude_regexes = [".*: warning: The following parameters of .*", "^  parameter '"]

# A list of Doxygen alias definitions that are passed to the Doxygen `ALIASES <https://www.doxygen.nl/manual/config.html#cfg_aliases>`__ command.
doxygen_aliases = []

# A list of predefined macros that are passed to the Doxygen `PREDEFINED <https://www.doxygen.nl/manual/config.html#cfg_predefined>`__ command.
doxygen_predefined = []

# .. versionadded:: 0.40.3
#
# A boolean which controls whether both the typedef and struct will be included in the documentation.
# This can be used to suppress duplicate definition warnings when the typedef name and struct label are the same.
doxygen_typedef_hides_struct_enabled = false

# A string that is appended to the Doxygen configuration file.
doxygen_conf_extra = ""

# The long name of the project.
name = ""  # "" is a sentinel value which will be replaced by the project name from the :file:`repo.toml` section.

# The default output format is HTML, but can also be set to "text" or "latex" for example
output_format = "html"

# The author of this documentation is specified in the :confval:`copyright` string.
author = "NVIDIA Corporation"

# .. versionchanged:: 1.0.0
#
#    ``copyright_start`` is now a required configuration value.
#
# The copyright start year.
copyright_start = 0

# The copyright string to be injected into the documentation.
# Can be a string template with the substitutions ``author`` and ``years`` being valid.
copyright = "${years}, ${author}"

# A boolean which enables the version selector in the documentation.
version_selector_enabled = true

# A list of ``version``/``note`` pairs that are applied to the versions in the version selector.
version_selector_notes = []

# Add an announcement to the top of HTML pages.
# An HTML string that is injected into all HTML pages to show a header banner.
# Useful for:
#
# - Important notices or warnings
# - Beta/Preview announcements
# - Version deprecation notices
# - Links to newer versions
announcement = ""

# A string key to a pre-defined set of social media links. Currently, ``omniverse`` is the only valid value.
social_media_set = "omniverse"

# A list of pairs denoting social media links to be included in the output.
# Pairs should be of the form ``[site_name, url]``, for example ``["www", "https://www.nvidia.com/en-us/omniverse/"]``.
# The site name should match the desired FontAwesome 6 icon. https://fontawesome.com/icons.
# Common icon names include "gitlab", "youtube", "instagram", "linkedin", "twitch", "twitter", "pdf."
social_media = []

# Path to the Python binary used to run Sphinx.
#
# Can use :ref:`docs-substitutions`.
#
# By default (an empty string), *repo_docs* will use the same Python executable it was invoked with.
# This is normally Packman's Python executable, defined by the ``PM_PYTHON`` environment variable.
python_path = ""

# Path to `.py` and `.pyd` files whose docstring should be extracted.
#
# Can use :ref:`docs-substitutions`.
#
# Relative paths are relative to ``${docs_root}``. Wildcards are supported.
python_paths = []

# Paths to be added to ``PATH`` (windows) / ``LD_LIBRARY_PATH`` (linux).
#
# Can use :ref:`docs-substitutions`.
#
# Relative paths are relative to ``${docs_root}``. Wildcards are supported.
#
# .. note::
#
#    From Python 3.8 onwards, ``os.add_dll_directory`` is used on Windows.
library_paths = []

# If set to true, this keeps the generated Sphinx :file:`conf.py` file after build for debugging purposes.
# This is useful when:
#
# - Debugging Sphinx configuration issues
# - Verifying extension settings
# - Checking how substitutions are being processed
#
# The file will be kept in the ``docs_root`` directory.
keep_sphinx_conf_py = false

# The root document (index) file for Sphinx documentation.
# This is the main entry point of your documentation.
# The value should be the document name without the file extension.
# For example, if your main documentation file is :file:`index.rst`, use "index".
# This file must exist in your documentation source directory.
root_doc = "index"

# A list of filepath patterns (relative to ``${docs_root}``) which are used to exclude files from consideration by Sphinx.
#
# If a directory is given, its contents are recursively excluded.
sphinx_exclude_patterns = []

# To force include subfolders after their parent folder is excluded with :confval:`sphinx_exclude_patterns`.
#
# .. note::
#
#    :confval:`sphinx_dont_exclude_patterns` is unable to match paths that contain a wildcard in :confval:`sphinx_exclude_patterns`.
sphinx_dont_exclude_patterns = []

# .. versionchanged:: 0.41.0
#
# A list of dependencies for this project.
#
# Each entry in the list must be either another list or a mapping.
#
# .. rubric:: List
#
# Pairs have the form ``[name, path]``, where ``name`` is used for intersphinx references, and path is either a relative
# path (relative to ``docs_root``) to the directory containing ``objects.inv`` or a URL.
#
# .. rubric:: Mapping
#
# Mappings can take three different forms depending on the type of dependency:
#
# #. **URL:**
#
#    This type of dependency requires specifying the URL of the external documentation.
#
#    ``name``: ``str``
#      The name used for intersphinx references.
#
#    ``url``: ``str``
#      The root URL of the external documentation must also be the location of the :file:`objects.inv` file.
#
# #. **Path:**
#
#    This type of dependency requires specifying the (local) path to the :file:`objects.inv` file
#
#    ``name``: ``str``
#      The name used for intersphinx references.
#
#    ``path``: ``str``
#      The absolute local path to the external documentation must also be the location of the :file:`objects.inv` file.
#
# #. **Project:**
#
#    This type of dependency links to another project in the :file:`repo.toml`.
#
#    ``project``: ``str``
#      The name of another project in the :file:`repo.toml` file, which is the dependency.
#
#    ``name``: optional ``str``
#      The name used for intersphinx references.
#
#      Defaults to the project name.
#
#    ``build``: optional ``str``
#      The name of the build in the target project, which is the dependency.
#
#      Defaults to the current build name.
#
#    ``with_doxygen``: optional ``bool``
#      A boolean to indicate whether this project is also a Doxygen dependency of the current project.
deps = []

# A list of additional Sphinx extensions to be enabled during the build.
# Each must be found in one of the :confval:`python_paths` or be an existing built-in Sphinx extension.
extensions_extra = []

# A string that is appended to the Sphinx configuration file.
sphinx_conf_py_extra = ""

# .. versionadded:: 0.52.2
#
# String for developers to customise the file for Sphinx warnings.
# The variable can include a path. Default value set if there are no customizations.
sphinx_warnings_path = "${docs_dst}/sphinx_warnings.txt"

# Eclipse settings

# The plugin ID to use for the Eclipse help plugin output.
# This value is required when :confval:`output_format` is ``"eclipse"``; it is ignored for other formats.
eclipse_plugin_id = ""

# Latex settings

# A mapping of font names to the directories that contain them.
# Must provide both ``nvidia_sans`` and ``roboto_mono`` as keys.
latex_font_directories = {}

# A boolean that controls whether the list of tables is added after the table of contents in LaTeX builds.
latex_list_of_tables_enabled = false

# A boolean that controls whether the list of figures is added after the table of contents in LaTeX builds.
latex_list_of_figures_enabled = false

# A string that defines the alignment for figures. See ``figure_align`` in
# the `latex_elements documentation <https://www.sphinx-doc.org/en/master/latex.html#the-latex-elements-configuration-setting>`__.
latex_figure_alignment = "htbp"

# The `autosummary` extension may be optionally enabled by specifying configuration in the ``autosummary`` table.
#
# The leading `autosummary_` can be optionally omitted from configuration values.
# The following two configurations are equivalent:
#
# .. code-block:: toml
#
#    autosummary.autosummary_generate = true
#    autosummary.autosummary_generate_overwrite = true
#
# .. code-block:: toml
#
#    autosummary.generate = true
#    autosummary.generate_overwrite = true
autosummary = { enabled = false }

# The ``autodoc`` extension configuration can be set in the same way as :confval:`autosummary`.
autodoc = {}

# Numfig configuration

# .. versionadded:: 0.20.1
#
# A boolean which, when true, enables automatic numbering of figures, tables, and code-blocks.
# See :external:confval:`numfig`.
auto_number_figures_enabled = false

# .. versionadded:: 0.20.1
#
# A mapping of figure types to the format that their label should take.
# See :external:confval:`numfig_format`.
auto_number_figures_label_formats = { table = "Table %s", figure = "Figure %s", code-block = "Listing %s", section = "Section %s" }

# .. versionadded:: 0.20.1
#
# An integer indicating the section level at which numbering is consecutive.
# See :external:confval:`numfig_secnum_depth`.
auto_number_figures_numbering_depth = 1

# Allow specifying build tags in addition to the default tag (`build_name`).
#
# The variable takes a list of strings that meet the requirements for `Python identifiers <https://docs.python.org/3/library/stdtypes.html#str.isidentifier>`__.
build_tags = []

# Boolean specifying if the source files are copied to the output; the default is to avoid exposing content unexpectedly.
copy_source = false

# .. versionadded:: 0.40.4
#
# A string specifying the default language for code blocks.
#
# Valid values can be found in the `Sphinx documentation <https://www.sphinx-doc.org/en/master/usage/restructuredtext/directives.html#code-examples>`__.
highlight_language = "c++"

# .. versionadded:: 0.42.0
#
# Boolean specifying whether to enable the sphinx_copybutton extension.
#
# Refer to the `configuration <https://sphinx-copybutton.readthedocs.io/en/latest/use.html#use-and-customize>`__ documentation for the sphinx-copybutton extension.
copybutton_enabled = false

# .. versionadded:: 0.42.0
#
# A string that specifies the prompts, such as ``>>>``, ``$``, and ``#``, to strip from
# text in code blocks when copying text to the clipboard.
#
# The variable is a regular expression.
# Refer to the `configuration <https://sphinx-copybutton.readthedocs.io/en/latest/use.html#use-and-customize>`__ documentation for the sphinx-copybutton extension.
copybutton_prompt_text = ">>> |$ |# "

# .. versionadded:: 0.42.0
#
# A string that specifies the highlight language classes to exclude from the code block text.
# The default value excludes line numbers in code blocks, prompt characters, and sample output.
#
# Refer to the `configuration <https://sphinx-copybutton.readthedocs.io/en/latest/use.html#use-and-customize>`__ documentation for the sphinx-copybutton extension.
copybutton_exclude = ".linenos, .gp, .go"

# .. versionadded:: 0.42.0
#
# A string that specifies the character that is used in the code block to show multiple-line commands.
# The default value matches the backslash character (``\``) that Bash and other shells use.
#
# Refer to the `configuration <https://sphinx-copybutton.readthedocs.io/en/latest/use.html#use-and-customize>`__ documentation for the sphinx-copybutton extension.
# Because the default value, backslash, is the escape character, it is also escaped with a second backslash.
copybutton_line_continuation_character = '\\'

# .. versionadded:: 0.32.0
#
# Boolean to control whether C++ API documentation is produced automatically.
api_enabled = true

# .. versionadded:: 0.40.3
#
# Boolean to control whether C++ API documentation is produced for undocumented members.
api_include_undocumented_enabled = true

# Doxygen to reST API configuration

# The title of the API root page. If blank, the title ``name API`` is used. ``${name}`` is :confval:`name`.
api_title = ""  # "" is a sentinel value which will be replaced by "name API."

# .. versionadded:: 0.10.3
#
# A string that is the name of a directory (relative to ``docs_root``) where the API documentation should be generated.
#
# The directory must be exclusively for generated API documentation
# (that is, it should either: not exist, be empty, or only contain files with the `.rebreather_rst` extension.).
#
# .. code-block:: toml
#
#    api_output_directory = "api"
#
# .. note::
#
#    If you specify ``api_output_directory``, you should add ``*.rebreather_rst`` to your :file:`.gitignore` file (see below for details).
#
# .. caution::
#
#    Starting with version ``1.0``, this configuration value will be required when building documentation with Doxygen.
api_output_directory = ""

# .. versionadded:: 0.10.3
#
# A string that controls how the API output is grouped and the name of the files.
# There are currently two available options:
#
# ``doxygen``
#    This results in output with file names that match Doxygen output.
#    Members are generally included on their parents' pages.
#
# ``exhale``
#    This results in output with file names that match Exhale output.
#    Members are generally output to their own separate pages.
api_output_style = "exhale"

# .. versionadded:: 0.10.3
#
# .. versionchanged:: 0.20.0
#
#    Remapping a kind to a blank string no longer removes it from the docs; use :confval:`api_item_filters`.
#
# A table that can be used to group different kinds of API objects together.
# Provide a map from their existing kind to the kind they should appear as in the documentation.
#
# Doxygen produces documentation for many kinds, some of the most common are:
#
# .. hlist::
#    :columns: 8
#
#    - ``class``
#    - ``concept``
#    - ``define``
#    - ``dir``
#    - ``enum``
#    - ``enumvalue``
#    - ``file``
#    - ``function``
#    - ``group``
#    - ``interface``
#    - ``namespace``
#    - ``page``
#    - ``struct``
#    - ``typedef``
#    - ``union``
#    - ``variable``
#
# For example, to have structs appear as classes:
#
# .. code-block:: toml
#
#    api_remap_kinds = { struct = "class" }
#
# You can also create new kinds using this map.
# If you want both classes and structs to instead appear in a new ``classlike`` section, you could use:
#
# .. code-block:: toml
#
#    api_remap_kinds = { class = "classlike", struct = "classlike" }
api_remap_kinds = {}

# .. versionadded:: 0.10.3
#
# A table used to control the titles of sections used for each kind.
# Provide a map from the kind to the title you want to appear in the documentation.
#
# For example, to have structs appear in a section named ``Data Structures``:
#
# .. code-block:: toml
#
#    api_remap_kind_titles = { struct = "Data Structures" }
#
# .. note::
#
#    The specified kinds must take into account any remappings specified in ``api_remap_kinds``.
api_remap_kind_titles = {}

# .. versionadded:: 0.10.3
#
# A list of tables that allows you to specify how API pages are grouped together into toctrees on separate pages.
#
# Each table in the list provided must include three keys:
#
# ``docname``: ``str``
#    The name of the output document, which you must include in a toctree elsewhere in your documentation.
#    This could be used in the ``toc_docnames`` entry for ``api_root_page`` or in another hand-written rST file.
#
# ``title``: ``str``
#    The title used on the root API page.
#
# ``kinds``: ``list[str]``
#    A list of kinds which will be included on this page and in its toctree.
#
# If you wanted to only generate a toc page for functions and classes, you could use the following:
#
# .. code-block:: toml
#
#    api_toc_pages = [
#       { docname = "functions", title = "Functions List", kinds = ["function"] },
#       { docname = "classes", title = "Class List", kinds = ["class"] },
#    ]
#
# .. note::
#
#    The specified kinds must take into account any remappings in ``api_remap_kinds``.
#
# .. note::
#
#    If this value is not specified, a ``toc_page`` will be automatically generated for each kind in the Doxygen output.
api_toc_pages = "*"

# .. versionadded:: 0.40.3
#
# A list of tables that allows you specify how API members' pages are grouped together into indices on separate pages.
#
# A special value of ``"*"`` may be provided to automatically generate separate pages for each kinds members.
#
# Each table in the list provided must include three keys:
#
# ``docname``: ``str``
#    The name of the output document, which you must include in a toctree elsewhere in your documentation.
#    This could be used in the ``toc_docnames`` entry for ``api_root_page`` or in another hand-written rST file.
#
# ``title``: ``str``
#    The title used on the root API page.
#
# ``kinds``: ``list[str]``
#    A list of kinds that will have their members included on this page.
#
# If you wanted to only generate a member index page for classes, you could use the following:
#
# .. code-block:: toml
#
#    api_member_pages = [
#       { docname = "class-members", title = "Class Members", kinds = ["class"] },
#    ]
#
# .. note::
#
#    The specified kinds must take into account any remappings in ``api_remap_kinds``.
api_member_pages = []

# .. versionadded:: 0.20.0
# .. versionchanged:: 0.40.0
# .. versionchanged:: 0.41.0
#
#    A list of strings can be provided to ``attribute``, ``matching``, and ``not_matching``.
#
# A list of tables that allows you to filter which items from the API will be present in the documentation.
#
# The default filters (which are automatically added, but can be overridden using ``include`` rules specifying the same group) are equivalent to:
#
# .. code-block:: toml
#
#    api_item_filters = [
#       { rule = "exclude", attribute = "kind", matching = "friend", group = "kind-friend" },
#       { rule = "exclude", attribute = "protection", matching = "private", group = "protection-private" },
#       { rule = "exclude", attribute = "kind", matching = "dir", group = "kind-dir" },
#       { rule = "exclude", attribute = "kind", matching = "file", group = "kind-file" },
#    ]
#
# Each table in the list provided can specify the following keys:
#
# ``rule``: ``str``
#    The type of rule being specified, which is one of: ``include`` or ``exclude``.
#
#    Rules are applied sequentially in the order given in the list, so later rules can override earlier rules.
#
# ``attribute``: ``str`` or ``list[str]``
#    The API attribute to check when filtering.
#
#    This may use dot syntax to access nested attributes; for example, ``location.path`` returns the
#    filepath of the item's location attribute.
#
#    If a list is provided, each attribute will be retrieved from the item.
#    Attribute values are matched individually and combined with a logical "and".
#    When ``attribute`` is a list, ``matching``/``not_matching`` must also be a list with the same number of elements.
#
#    If an attribute is not found, the rule is assumed not to match.
#
# ``matching`` / ``not_matching``: ``str`` or ``list[str]``
#    A string representing an :external:doc:`fnmatch <library/fnmatch>`-style pattern.
#
#    When a list is provided, each entry is matched against the corresponding attribute specified in ``attribute``.
#
#    Only one of ``matching`` or ``not_matching`` can be specified for a given filter.
#
# ``group``: optional ``str``
#    .. versionadded:: 0.40.0
#
#    An optional string specifying the name of the group to which the rule belongs.
#    If not specified, the default group is used.
#
#    Rules can only override (or be overridden by) other rules in the same group.
#
#    If any group of rules excludes an item, that item will not be included by *rebreather*.
api_item_filters = []

# .. versionadded:: 2.8.0
#
# Boolean to enable concurrent per-project Sphinx builds.
#
# When enabled (and ``project_build_order`` is not set), every project is built twice
# on a thread pool: pass 1 with ``-W`` off to produce each project's ``objects.inv``,
# then pass 2 with ``--fresh-env`` and the caller's strict setting so cross-project
# references resolve against the pass-1 inventories. Builds that share a ``docs_root``
# serialize, while cross-project builds run in parallel.
#
# When disabled (the default), projects build serially in repo.toml declaration order.
#
# Mutually exclusive with ``project_build_order``.
parallel_project_builds = false

# .. versionadded:: 2.8.0
#
# Maximum number of concurrent project builds when ``parallel_project_builds``
# is enabled. Must be a non-negative integer; ``0`` (the default) means use
# the host's CPU count.
#
# Projects that want to control concurrency from the environment can wire
# in any env var via the standard substitution, e.g.
# ``parallel_project_jobs = "${env:OMNI_REPO_BUILD_JOBS}"``.
parallel_project_jobs = 0

# Enhanced search provides additional functionality for users.
#
# The most useful of these is quoted search terms, which must be present in a result for it to match.
# For example, searching for ``hello world`` will produce results that contain either ``hello`` or ``world``.
# Results with both will have a higher search score and so will appear nearer the top of the results.
# However, using the quoted search ``'hello world'`` will produce only results that contain both ``hello`` and ``world``.
#
# .. note::
#
#    The current enhanced search engine is `Lunr.js <https://lunrjs.com/>`__, but this may change in the future.
enhanced_search_enabled = true

# .. versionadded:: 1.1.0
#
# An experimental fast toctree implementation that uses JavaScript to inject the toctree on page load
# rather than writing static HTML to every page file.
#
# Benefits:
#
# - Faster documentation build times
# - Reduced file sizes
#
# Limitations:
#
# - Requires JavaScript to be enabled
# - May not work with all Sphinx extensions
# - Still experimental and may have bugs
experimental_fast_toctree = false

# .. versionadded:: 0.20.2
#
# A list of mappings of projects to be included when searching in this project.
#
# Valid keys include: ``project``, ``build``, ``prefix_template``
#
# For example, to add the ``detailed`` build from the ``demo`` project to the current project's search:
#
# .. code-block:: toml
#
#    search_other_projects = [
#       { project = "demo", build = "detailed" }
#    ]
#
# If ``build`` is omitted, it will be assumed to match the current build.
#
# If ``prefix_template`` is omitted, :confval:`search_prefix_template` will be used.
# If specified, it can use the same template values.
#
# Both ``project`` and ``build`` can be strings representing an :external:doc:`fnmatch <library/fnmatch>`-style pattern.
# The current project is never included in any wildcard match.
#
# Requires :confval:`enhanced_search_enabled` to be ``true``.
search_other_projects = []

# .. versionadded:: 0.20.2
#
# .. versionchanged:: 0.31.0
#
#    The default value will use the relative output paths to determine the prefix (see :confval:`output_path_template`).
#
# A template string to build the relative paths to other projects when using cross-site search.
# If an empty string is given, the prefix path will be based on the relative output paths, see :confval:`output_path_template`.
#
# Can use :ref:`docs-substitutions`.
#
# Requires :confval:`enhanced_search_enabled` to be ``true``.
search_prefix_template = ""

# The :confval:`repo_url` string variable is used to set the base URL for links to repository content.
repo_url = ""

# .. versionadded:: 0.42.0
#
# The :confval:`baseurl` string variable is used to set the canonical URL for HTML pages.
# See :external:confval:`html_baseurl` for more details.
baseurl = ""

# .. versionadded:: 0.38.0
#
# The :confval:`logo_target_url` string variable can be used to change the default link
# target for the logo icon at the top of the navigation bar. It accepts both an absolute URL and a relative
# URL.
#
# .. code:: toml
#
#     logo_target_url = "../index.html"
#
# In the case above, the URL will be resolved from the `root_doc` (master_doc) as a basis. This is very useful when
# using a portal site on top of multiple sites built by *repo_docs*.
logo_target_url = ""

# .. versionadded:: 0.40.3
#
# A boolean to control whether external links in the documentation open in a new tab.
external_links_open_new_tab = false

# .. versionadded:: 0.10.5
#
# The :confval:`extra_breadcrumbs` variable is a list of extra breadcrumbs to be added.
# Each item in the list must be a dictionary with the following keys:
#
# ``name``
#     The text to be displayed in the breadcrumb.
#
# ``url``
#     The target URL for a link in the breadcrumb. If this is the empty string (``""``), plain text will be output
#     instead of a hyperlink.
#
#     If the URL has a leading ``/``, then it will be taken as relative to the root of the documentation.
#     In this instance, *repo_docs* will check whether this link points to another document.
#     For example, if the ``root_doc`` is ``index``, then a URL of ``/index`` will create a link to the root page.
#
# For example:
#
# .. literalinclude:: /../repo.toml
#    :language: toml
#    :name: repo_toml
#    :start-after: example-begin extra_breadcrumbs
#    :end-before: example-end extra_breadcrumbs
extra_breadcrumbs = []

# .. versionadded:: 0.32.0
#
# A list of mappings of redirects to be added to the project.
#
# A redirects example :
#
# .. literalinclude:: /../repo.toml
#    :language: toml
#    :start-after: example-begin redirects
#    :end-before: example-end redirects
#
# Each mapping may have the following keys:
#
# ``path``: ``str``
#   The relative path to the page in the current project that is to be redirected.
#
# ``target``: ``str``
#   A complete URL (starting with either ``http`` or ``https``) or a relative path within the target project
#   (see below), which the redirect will forward the user to.
#
# ``project``: optional ``str``
#   The name of another project in the :file:`repo.toml` file that contains the redirect target.
#
#   Defaults to the current project name.
#
# ``build``: optional ``str``
#   The name of the build in the target project, which contains the redirect target.
#
#   Defaults to the current build name.
redirects = []

# Global metadata, which is added to all pages.
#
# A mapping of ``meta`` names to contents.
# Substitutions for ``${version}`` are supported.
#
# For example:
#
# .. code-block:: toml
#
#    metadata_global = { docs-version = "${version}", project-name = "repo_docs" }
#
# will inject the following into all built HTML pages
#
# .. code-block:: html
#
#    <meta content="repo_docs" name="project-name">
#    <meta content="${repo_docs_version}" name="docs-version">
metadata_global = {}

# .. versionadded:: 0.32.0
#
# A mapping of names to values to be used as source substitutions across the project.
#
# Keys must be valid Python identifiers.
#
# Keys that clash with :ref:`pre-defined source substitutions <rst_substitution>` will be overridden.
source_substitutions = {}

# .. versionadded:: 1.4.0
#
# A boolean that produces warn-level logging if `source_substitutions` is missing a key
# in reused content.
#
# By default, missing keys are logged with info-level logging.
#
# For example, if reused content has a `${__product_long_name}` key and
# `source_substitutions` does not include `__product_long_name = <value>`, the
# log identifies the missing key.
source_substitutions_warnings_enabled = false

# A string or list of strings to be inserted in the ``<head>`` tag of each page:
#
# .. code-block:: toml
#
#    extra_content_head = [
#        '''
#        <!-- This is a comment that will be added to the head tag of the page. -->
#        <script>console.log("extra content added to head")</script>
#        ''',
#    ]
extra_content_head = []

# A string or list of strings to be inserted in the ``<footer>`` tag (which itself is within the ``<body>`` tag) of each page.
# See :confval:`extra_content_head`.
extra_content_footer = []

# .. versionadded:: 2.5.0
#
# A boolean that enables the public docs features of the NVIDIA Sphinx Theme including:
#
#   - OneTrust Consent Management
#   - The ``Is this page helpful?`` feedback link
#   - Adobe Launch
public_docs_features = false

# .. versionadded:: 0.51.0
#
# A boolean that enables the legal notices in the footer, as shown on nvidia.com.
default_footer_notice_links_enabled = false

# .. versionadded:: 0.40.1
#
# Boolean to control if overriding the version in merge requests is enabled.
#
# This is typically used so that uploading the documentation does not clash with a published version.
mr_version_override_enabled = true

# .. versionadded:: 2.4.0
#
# Boolean to control if the `sphinx-sitemap <https://sphinx-sitemap.readthedocs.io/en/latest/index.html>`__ extension is enabled.
# If enabled, a :file:`sitemap.xml` file will be generated at build time and added to the project's output directory.
# This can be enabled per project.
#
# .. warning::
#
#    If ``sitemap_enabled = true``, a :confval:`baseurl` must be configured in :file:`repo.toml`, or builds will fail.
sitemap_enabled = false

# .. versionadded:: 2.4.0
#
# String template for generating URLs in the sitemap.xml file.
# The template supports the following variables:
#
# - ``{version}`` - The version of the documentation
# - ``{lang}`` - The language code (if using internationalization)
# - ``{link}`` - The relative path to the html page
#
# example: ``sitemap_url_scheme = "{version}{lang}project_name/latest{link}"``
sitemap_url_scheme = "{link}"
