<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title description">
  <title id="title">Share of Total Match Duration</title>
  <desc id="description">Bar chart showing meaningful rally action at 26.72 percent and non-action video at 73.28 percent of total tennis match duration.</desc>

  <rect width="900" height="540" rx="16" fill="#ffffff"/>

  <text x="450" y="54" text-anchor="middle" fill="#1a1a1a"
        font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">
    Share of Total Match Duration
  </text>

  <g stroke="#d9dde2" stroke-width="1.5">
    <line x1="120" y1="420" x2="850" y2="420"/>
    <line x1="120" y1="340" x2="850" y2="340"/>
    <line x1="120" y1="260" x2="850" y2="260"/>
    <line x1="120" y1="180" x2="850" y2="180"/>
    <line x1="120" y1="100" x2="850" y2="100"/>
  </g>

  <g fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="17">
    <text x="102" y="426" text-anchor="end">0</text>
    <text x="102" y="346" text-anchor="end">25</text>
    <text x="102" y="266" text-anchor="end">50</text>
    <text x="102" y="186" text-anchor="end">75</text>
    <text x="102" y="106" text-anchor="end">100</text>
  </g>

  <text x="34" y="260" text-anchor="middle" fill="#4b5563"
        font-family="Arial, Helvetica, sans-serif" font-size="17"
        transform="rotate(-90 34 260)">
    Share of match duration (%)
  </text>

  <rect x="210" y="334.5" width="210" height="85.5" rx="8" fill="#76b900"/>
  <rect x="550" y="185.5" width="210" height="234.5" rx="8" fill="#b8bdc4"/>

  <g fill="#1a1a1a" font-family="Arial, Helvetica, sans-serif"
     font-size="25" font-weight="700">
    <text x="315" y="316" text-anchor="middle">26.72%</text>
    <text x="655" y="167" text-anchor="middle">73.28%</text>
  </g>

  <g fill="#1a1a1a" font-family="Arial, Helvetica, sans-serif" font-size="19">
    <text x="315" y="456" text-anchor="middle">
      <tspan x="315" dy="0">Meaningful</tspan>
      <tspan x="315" dy="24">rally action</tspan>
    </text>
    <text x="655" y="456" text-anchor="middle">
      <tspan x="655" dy="0">Non-action</tspan>
      <tspan x="655" dy="24">video</tspan>
    </text>
  </g>
</svg>
